tracker_type: jdetracker # tracker type, ['botsort', 'bytetrack', 'smiletrack']

# Tracking arguments for Bodybuilding (STRICT & STICKY)
track_buffer: 120      # Increased from 40: Keep track alive for 2 seconds (at 60fps) if occluded
conf_thresh: 0.50      # Increased from 0.35: Kill noise/background detections
first_match_thresh: 0.4 # Higher is stricter: Only match if embeddings are very similar
second_match_thresh: 0.6 # For lower confidence detections
new_match_thresh: 0.5   # Threshold for creating a new track (prevents ID jumps)

# ReID arguments
with_reid: True  # always True for this tracker
